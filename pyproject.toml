[project]
name = "industrial-commerce-product-ai-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bs4>=0.0.2",
    "fastapi>=0.116.0",
    "httpx>=0.28.0",
    "pydantic>=2.11.0",
    "python-dotenv>=1.1.0",
    "supabase>=2.18.0",
    "tavily-python>=0.7.27",
]

[project.optional-dependencies]
# These tools support the local Streamlit UI and experimental agent workflow.
# They are deliberately excluded from Vercel's production function bundle.
agent = [
    "deepagents>=0.7.6",
    "huggingface-hub>=1.27.0",
    "langchain>=1.3.15",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.11",
    "langsmith>=0.11.0",
    "litellm>=1.97.0",
    "mcp>=2.0.0",
    "ollama>=0.6.2",
]
browser = ["playwright>=1.62.0"]
documents = ["pypdf>=6.16.1", "reportlab>=5.0.0"]
ui = ["pandas>=2.0.0", "streamlit>=1.47.0", "uvicorn>=0.35.0"]

[tool.uv]
# This repository is an application, not an installable Python package.
package = false
